version: '3'

volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: vikzo/kittygram_backend:latest
    env_file: .env
    volumes:
      - static_volume:/backend_static/
      - media_volume:/app/media/
    depends_on:
      - db

  frontend:
    image: vikzo/kittygram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static/

  gateway:
    image: vikzo/kittygram_gateway:latest
    ports:
      - "9000:80"
    volumes:
      - static_volume:/staticfiles/
      - media_volume:/media/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
