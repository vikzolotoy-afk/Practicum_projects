[flake8]
ignore =
    W503,
    F811
exclude =
    tests/,
    */migrations/,
    data/,
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[mypy]
plugins = 
    mypy_django_plugin.main

[isort]
known_first_party = api, recipes, users, foodgram_backend
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
line_length = 79
multi_line_output = 3
include_trailing_comma = True
